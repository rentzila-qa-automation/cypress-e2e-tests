name: E2E tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Every day at 06:00 UTC (08:00 Kyiv in winter, 09:00 in summer). Scheduled runs always use main.
  schedule:
    - cron: '0 6 * * *'

# All runs use the same test accounts on dev, so they go one at a time.
concurrency:
  group: e2e-dev-shared-accounts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT_DIR: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create cypress.env.json from secret
        env:
          CYPRESS_ENV_JSON: ${{ secrets.CYPRESS_ENV_JSON }}
        run: |
          if [ -z "$CYPRESS_ENV_JSON" ]; then
            echo "::error::Secret CYPRESS_ENV_JSON is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$CYPRESS_ENV_JSON" > cypress.env.json

      - name: Run Cypress
        run: npm run cy:run:chrome

      # History lives next to each report on gh-pages (<REPORT_DIR>/history/history.jsonl).
      # Pull it before generating, so the new report shows trends from previous runs.
      - name: Restore Allure history
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-history
          if git fetch --depth=1 origin gh-pages 2>/dev/null \
            && git show "origin/gh-pages:${REPORT_DIR}/history/history.jsonl" > allure-history/history.jsonl 2>/dev/null; then
            echo "History restored: $(wc -l < allure-history/history.jsonl) previous runs."
          else
            rm -f allure-history/history.jsonl
            echo "No history yet, starting a new one."
          fi

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          npm run allure:generate
          mkdir -p allure-report/history
          cp allure-history/history.jsonl allure-report/history/history.jsonl

      - name: Upload Allure report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.REPORT_DIR }}
          path: allure-report
          retention-days: 14

      - name: Publish Allure report to GitHub Pages
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: ${{ env.REPORT_DIR }}
          keep_files: true

      # The site root is what Deployments, About and README link to: the latest report from main.
      - name: Publish main report to site root
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

      - name: Add report link to run summary
        if: ${{ !cancelled() }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${REPORT_DIR}/"
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
